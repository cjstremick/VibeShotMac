name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Regression checks
        run: ./scripts/test.sh
      - name: Check Xcode project
        run: >-
          xcodebuild -project VibeShot/VibeShot.xcodeproj -scheme VibeShot
          -configuration Release -destination 'platform=macOS'
          -derivedDataPath build/xcode build
      - name: Build universal app
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a vMAJOR.MINOR.PATCH release tag'; exit 1; }
          export VERSION
          ./scripts/package.sh
      - name: Generate Homebrew cask
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib
          version = os.environ['RELEASE_TAG'][1:]
          checksum = hashlib.sha256(pathlib.Path('build/VibeShot.zip').read_bytes()).hexdigest()
          repository = os.environ['RELEASE_REPOSITORY']
          pathlib.Path('build/vibeshot.rb').write_text(f'''cask "vibeshot" do
            version "{version}"
            sha256 "{checksum}"
            url "https://github.com/{repository}/releases/download/v{version}/VibeShot.zip"
            name "VibeShot"
            desc "Screenshot and markup tool"
            homepage "https://github.com/{repository}"
            depends_on macos: ">= :sequoia"
            app "VibeShot.app"
          end
          ''')
          PY
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/VibeShot.zip
            build/vibeshot.rb
          generate_release_notes: true
      - name: Update Homebrew tap when configured
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ -z "$TAP_GITHUB_TOKEN" ]]; then
            echo 'No tap token configured; cask is available in the release assets.'
            exit 0
          fi
          # Keep credentials out of the remote URL and persisted git configuration.
          cat > "$RUNNER_TEMP/vibeshot-askpass" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) printf '%s\n' 'x-access-token';; *) printf '%s\n' "$TAP_GITHUB_TOKEN";; esac
          SH
          chmod 700 "$RUNNER_TEMP/vibeshot-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/vibeshot-askpass" GIT_TERMINAL_PROMPT=0
          trap 'rm -f "$GIT_ASKPASS"' EXIT
          git clone https://github.com/cjstremick/homebrew-tap.git build/homebrew-tap
          mkdir -p build/homebrew-tap/Casks
          cp build/vibeshot.rb build/homebrew-tap/Casks/vibeshot.rb
          cd build/homebrew-tap
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Casks/vibeshot.rb
          git diff --cached --quiet || git commit -m "Update vibeshot to $RELEASE_TAG"
          git push
